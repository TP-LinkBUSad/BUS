        // 创建图标函数
        function getIcon() {
            var canvas = document.createElement('canvas');
            canvas.width = 30;  // 图标宽度
            canvas.height = 30;  // 图标高度
            var ctx = canvas.getContext('2d');

            // 绘制外部圆形（蓝色）
            ctx.beginPath();
            ctx.arc(15, 15, 12, 0, 2 * Math.PI, false);  // 绘制圆形
            ctx.fillStyle = 'rgb(74, 205, 213)';  // 设置圆形填充颜色
            ctx.fill();

            // 绘制内部小圆点（白色）
            ctx.beginPath();
            ctx.arc(15, 15, 5, 0, 2 * Math.PI, false);  // 绘制小圆点
            ctx.fillStyle = '#ffffff';  // 设置小圆点颜色为白色
            ctx.fill();

            return canvas.toDataURL();  // 返回图标的Base64编码
        }

        // 遍历班车站点数据并批量添加标注
        stations.forEach(function(station) {
            var iconUrl = getIcon(); // 获取图标

            var marker = new AMap.Marker({
                position: new AMap.LngLat(station.lnglat[0], station.lnglat[1]), // 设置标注位置
                title: station.name, // 设置标注名称
                icon: new AMap.Icon({
                    size: new AMap.Size(15, 15),  // 图标大小
                    image: iconUrl, // 设置图标图片
                    imageSize: new AMap.Size(15, 15) // 图标的显示尺寸
                }),
                map: map // 将标注添加到地图
            });

            // 设置标注下方显示站点名称
            marker.setLabel({
                content: station.name,  // 设置显示的站点名称
                offset: new AMap.Pixel(0, -30), // 微调名称位置，放置在标注图标下方
                direction: 'center'  // 设置标签的方向（居中对齐）
            });
        });

        // 调整视野，确保所有标注都可见
        map.setFitView();
